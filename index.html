<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f7;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #222; }
        p { font-size: 1.2rem; color: #666; margin-bottom: 40px; }
        .counter-box {
            background: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: inline-block;
            font-size: 0.9rem;
            color: #888;
        }
        .count {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff6600; /* Namecheap accent color */
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Something Exciting Is Coming</h1>
        <p>Our website is currently under construction. Check back soon!</p>
        
        <!-- Visitor Counter Widget -->
        <!-- Visitor Counter Widget -->
<div class="counter-box">
    Page Views
    <span class="count" id="visitor-count">0000</span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // CONFIGURATION: Replace these with your actual details from app.counterapi.dev
        const WORKSPACE = "hjava"; 
        const COUNTER_NAME = "hjava-counter";

        const endpoint = `https://api.counterapi.dev/v2/${WORKSPACE}/${COUNTER_NAME}/up`;

        fetch(endpoint)
            .then(response => response.json())
            .then(responseObj => {
                // CounterAPI V2 nesting structure places data inside responseObj.data.value
                if (responseObj && responseObj.data && responseObj.data.value !== undefined) {
                    const countElement = document.getElementById('up_count');
                    countElement.innerText = String(responseObj.data.value).padStart(4, '0');
                }
            })
            .catch(error => {
                console.error('CounterAPI Error:', error);
                document.getElementById('visitor-count').innerText = "----";
            });
    });
</script>

    </div>

</body>
</html>
